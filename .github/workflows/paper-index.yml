name: Paper Auto-Index

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '*.html'
      - '*.md'
      - '*.meta.yml'

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse papers and regenerate index
        run: node .github/scripts/parse-papers.js

      - name: Commit updated index
        run: |
          git config user.name "guild-bot"
          git config user.email "bot@aicraftspeopleguild.com"
          git add papers.json white-papers.html
          if git diff --cached --quiet; then
            echo "no index changes to commit"
          else
            git commit -m "auto-index: update paper listing"
            git push
          fi

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('papers.json')) return;
            const papers = JSON.parse(fs.readFileSync('papers.json', 'utf8'));
            const body = papers.map(p =>
              `- **${p.title}** (\`${p.id}\`) — ${p.type} · tags: ${p.tags.join(', ') || '(none)'}`
            ).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Paper Auto-Index\n\n${papers.length} paper${papers.length === 1 ? '' : 's'} indexed:\n\n${body}\n`
            });
